edition = "2024";

package genai;

import "google/antigravity/proto/events.proto";
import "google/antigravity/proto/steps.proto";
import "google/antigravity/proto/genai_json_annotations.proto";

option features = { field_presence : IMPLICIT enum_type : OPEN utf8_validation : NONE };

message LiveInteractionRequestPayload {
  oneof event_type {
    option (gaos.parsing.subtype_source) = true;

    .genai.CreateInteractionEvent create_interaction = 1
        [(gaos.parsing.json_discriminator_value) = "interaction.create"];
    .genai.ClientEvent event = 3;
    .genai.StepEvent step = 7
        [(gaos.parsing.json_discriminator_value) = "step"];
  }
}
message StepEvent {
  .genai.Step step = 1;
}
message LiveInteractionResponse {
  oneof event_type {
    option (gaos.parsing.subtype_source) = true;

    .genai.InteractionCreatedEvent interaction_created = 1
        [(gaos.parsing.json_discriminator_value) = "interaction.created"];
    .genai.ServerEvent event = 3;
  }
}
