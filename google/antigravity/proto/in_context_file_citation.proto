edition = "2024";

package genai;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

message BoundingBox {
  float left = 1;
  float top = 2;
  float bottom = 3;
  float right = 4;
  int32 page_number = 5;
}
message BoundingBoxAnchor {
  repeated .genai.BoundingBox bounding_boxes = 1;
}
message TimeSnippetAnchor {
  .google.protobuf.Duration start_offset = 1;
  .google.protobuf.Duration end_offset = 2;
}
message CommentThreadAnchor {
  string comment_thread_id = 1;
}
message FileAnchor {
  oneof anchor_type {
    .genai.BoundingBoxAnchor bounding_box_anchor = 3;
    .genai.TimeSnippetAnchor time_snippet_anchor = 4;
    string custom_key = 5;
    .genai.CommentThreadAnchor comment_thread_anchor = 6;
    string uri = 7;
  }
  string anchor_id = 1;
  string text_snippet = 2;
}
message InContextFileCitation {
  string uri = 1;
}
message FileCitationRenderingInfoMetadata {
  string name = 1;
  string mime_type = 2;
  string url = 3;
  .genai.ChatAnchorRenderingMetadata chat_anchor_rendering_metadata = 4;
  .genai.EmailAnchorRenderingMetadata email_anchor_rendering_metadata = 5;
  .genai.DocAnchorRenderingMetadata docs_anchor_rendering_metadata = 6;
  .genai.SlideAnchorRenderingMetadata slide_anchor_rendering_metadata = 7;
  .genai.SheetAnchorRenderingMetadata sheets_anchor_rendering_metadata = 8;
  .genai.WorkspaceRenderingMetadata workspace_rendering_metadata = 9;
  .genai.CommentThreadRenderingMetadata comment_thread_rendering_metadata = 10;
}
message ChatAnchorRenderingMetadata {
  message ChatAttachment {
    string attachment_name = 1;
    string mime_type = 2;
  }
  enum ChatSpaceType {
    CHAT_SPACE_TYPE_UNSPECIFIED = 0;
    SPACE = 1;
    GROUP_CHAT = 2;
    HUMAN_TO_HUMAN_DM = 3;
    HUMAN_TO_BOT_DM = 4;
  }
  string message_sender_name = 1;
  .google.protobuf.Timestamp message_creation_time = 2;
  string message_snippet = 3;
  .genai.ChatAnchorRenderingMetadata.ChatSpaceType chat_space_type = 4;
  .genai.ChatAnchorRenderingMetadata.ChatAttachment attachment = 5;
}
message WorkspaceRenderingMetadata {
  bool eligible_for_abuse_report = 1;
  bool hide_inline_citation = 2;
}
message EmailAnchorRenderingMetadata {
  message EmailAttachment {
    string url = 1;
    string mime_type = 2;
    string name = 3;
  }
  string message_url = 1;
  .genai.EmailAnchorRenderingMetadata.EmailAttachment email_attachment = 2;
}
message DocAnchorRenderingMetadata {
  string tab_title = 1;
  string heading_title = 2;
}
message SlideAnchorRenderingMetadata {
  int32 slide_number = 1;
  string slide_title = 2;
}
message SheetAnchorRenderingMetadata {
  string tab_title = 1;
}
message CommentThreadRenderingMetadata {
  string author_name = 1;
  string comment_snippet = 2;
  .google.protobuf.Timestamp create_time = 3;
}
