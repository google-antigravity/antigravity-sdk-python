edition = "2023";

package genai;

import "google/protobuf/duration.proto";
import "google/antigravity/proto/content.proto";
import "google/antigravity/proto/genai_json_annotations.proto";

message AudioResponseFormat {
  enum MimeType {
    TYPE_UNSPECIFIED = 0;
    TYPE_MP3 = 1 [(gaos.parsing.enum_value_name) = "audio/mp3"];
    TYPE_OGG_OPUS = 2 [(gaos.parsing.enum_value_name) = "audio/ogg_opus"];
    TYPE_L16 = 3 [(gaos.parsing.enum_value_name) = "audio/l16"];
    TYPE_WAV = 4 [(gaos.parsing.enum_value_name) = "audio/wav"];
    TYPE_ALAW = 5 [(gaos.parsing.enum_value_name) = "audio/alaw"];
    TYPE_MULAW = 6 [(gaos.parsing.enum_value_name) = "audio/mulaw"];
  }
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0;
    INLINE = 1 [(gaos.parsing.enum_value_name) = "inline"];
    URI = 2 [(gaos.parsing.enum_value_name) = "uri"];
  }
  .genai.AudioResponseFormat.MimeType mime_type = 1;
  .genai.AudioResponseFormat.Delivery delivery = 2;
  int32 sample_rate = 3;
  int32 bit_rate = 4;
}
message TextResponseFormat {
  enum MimeType {
    TYPE_UNSPECIFIED = 0;
    TYPE_APPLICATION_JSON = 1
        [(gaos.parsing.enum_value_name) = "application/json"];
    TYPE_TEXT_PLAIN = 2 [(gaos.parsing.enum_value_name) = "text/plain"];
  }
  .genai.TextResponseFormat.MimeType mime_type = 1;
  .genai.Struct schema = 2;
}
message ImageResponseFormat {
  enum MimeType {
    TYPE_UNSPECIFIED = 0;
    TYPE_JPEG = 1 [(gaos.parsing.enum_value_name) = "image/jpeg"];
  }
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0;
    INLINE = 1 [(gaos.parsing.enum_value_name) = "inline"];
    URI = 2 [(gaos.parsing.enum_value_name) = "uri"];
  }
  enum AspectRatio {
    ASPECT_RATIO_UNSPECIFIED = 0;
    ASPECT_RATIO_ONE_BY_ONE = 1 [(gaos.parsing.enum_value_name) = "1:1"];
    ASPECT_RATIO_TWO_BY_THREE = 2 [(gaos.parsing.enum_value_name) = "2:3"];
    ASPECT_RATIO_THREE_BY_TWO = 3 [(gaos.parsing.enum_value_name) = "3:2"];
    ASPECT_RATIO_THREE_BY_FOUR = 4 [(gaos.parsing.enum_value_name) = "3:4"];
    ASPECT_RATIO_FOUR_BY_THREE = 5 [(gaos.parsing.enum_value_name) = "4:3"];
    ASPECT_RATIO_FOUR_BY_FIVE = 6 [(gaos.parsing.enum_value_name) = "4:5"];
    ASPECT_RATIO_FIVE_BY_FOUR = 7 [(gaos.parsing.enum_value_name) = "5:4"];
    ASPECT_RATIO_NINE_BY_SIXTEEN = 8 [(gaos.parsing.enum_value_name) = "9:16"];
    ASPECT_RATIO_SIXTEEN_BY_NINE = 9 [(gaos.parsing.enum_value_name) = "16:9"];
    ASPECT_RATIO_TWENTY_ONE_BY_NINE = 10
        [(gaos.parsing.enum_value_name) = "21:9"];
    ASPECT_RATIO_ONE_BY_EIGHT = 11 [(gaos.parsing.enum_value_name) = "1:8"];
    ASPECT_RATIO_EIGHT_BY_ONE = 12 [(gaos.parsing.enum_value_name) = "8:1"];
    ASPECT_RATIO_ONE_BY_FOUR = 13 [(gaos.parsing.enum_value_name) = "1:4"];
    ASPECT_RATIO_FOUR_BY_ONE = 14 [(gaos.parsing.enum_value_name) = "4:1"];
  }
  enum ImageSize {
    IMAGE_SIZE_UNSPECIFIED = 0;
    IMAGE_SIZE_FIVE_TWELVE = 1 [(gaos.parsing.enum_value_name) = "512"];
    IMAGE_SIZE_ONE_K = 2 [(gaos.parsing.enum_value_name) = "1K"];
    IMAGE_SIZE_TWO_K = 3 [(gaos.parsing.enum_value_name) = "2K"];
    IMAGE_SIZE_FOUR_K = 4 [(gaos.parsing.enum_value_name) = "4K"];
  }
  .genai.ImageResponseFormat.MimeType mime_type = 1;
  .genai.ImageResponseFormat.Delivery delivery = 2;
  .genai.ImageResponseFormat.AspectRatio aspect_ratio = 3;
  .genai.ImageResponseFormat.ImageSize image_size = 4;
}
message VideoResponseFormat {
  enum Delivery {
    DELIVERY_UNSPECIFIED = 0;
    INLINE = 1 [(gaos.parsing.enum_value_name) = "inline"];
    URI = 2 [(gaos.parsing.enum_value_name) = "uri"];
  }
  enum AspectRatio {
    ASPECT_RATIO_UNSPECIFIED = 0;
    ASPECT_RATIO_SIXTEEN_BY_NINE = 1 [(gaos.parsing.enum_value_name) = "16:9"];
    ASPECT_RATIO_NINE_BY_SIXTEEN = 2 [(gaos.parsing.enum_value_name) = "9:16"];
  }
  enum Resolution {
    RESOLUTION_UNSPECIFIED = 0;
    RESOLUTION_THREE_SIXTY_P = 1 [(gaos.parsing.enum_value_name) = "360p"];
    RESOLUTION_SEVEN_TWENTY_P = 2 [(gaos.parsing.enum_value_name) = "720p"];
    RESOLUTION_TEN_EIGHTY_P = 3 [(gaos.parsing.enum_value_name) = "1080p"];
    RESOLUTION_FOUR_K = 4 [(gaos.parsing.enum_value_name) = "4k"];
  }
  .genai.VideoResponseFormat.Delivery delivery = 1;
  .genai.VideoResponseFormat.AspectRatio aspect_ratio = 3;
  .google.protobuf.Duration duration = 4;
  .genai.VideoResponseFormat.Resolution resolution = 5;
}
message ResponseFormat {
  oneof type {
    option (gaos.parsing.subtype_source) = true;

    .genai.AudioResponseFormat audio = 1;
    .genai.TextResponseFormat text = 2;
    .genai.ImageResponseFormat image = 3;
    .genai.VideoResponseFormat video = 4;
    .genai.Struct struct_value = 5 [
      (gaos.parsing.json_discriminator_values) = "string",
      (gaos.parsing.json_discriminator_values) = "number",
      (gaos.parsing.json_discriminator_values) = "integer",
      (gaos.parsing.json_discriminator_values) = "boolean",
      (gaos.parsing.json_discriminator_values) = "array",
      (gaos.parsing.json_discriminator_values) = "object"
    ];
  }
}
message ResponseFormatList {
  option (gaos.parsing.message_json_type) = JSON_TYPE_ARRAY;

  repeated .genai.ResponseFormat response_formats = 1;
}
